const vincent=skeleton(0,8,0x394e60,true,.95,true);const attendant=skeleton(-12,-1,0x683b4a,true,.85);const singer=skeleton(12,-3,0x7d3343,false,.9);const ghost=skeleton(8,5,0x356e6e,false,.72);

const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(),ground=new THREE.Plane(new THREE.Vector3(0,1,0),0);let destination=vincent.position.clone(),pending=null,walkTime=0;function interactAt(obj){const fn=obj.userData.action;if(fn)fn()}function tap(e){if(document.getElementById('dialog').style.display==='block')return;mouse.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(mouse,camera);let hits=ray.intersectObjects(interact,true);if(hits.length){let ob=hits[0].object;while(ob&&!ob.userData.action)ob=ob.parent;if(ob){const p=new THREE.Vector3();ob.getWorldPosition(p);destination.set(Math.max(-19,Math.min(19,p.x+ (p.x>0?-2:2))),0,Math.max(-11,Math.min(13,p.z+2)));pending=()=>interactAt(ob);return}}let p=new THREE.Vector3();if(ray.ray.intersectPlane(ground,p)){destination.set(Math.max(-20,Math.min(20,p.x)),0,Math.max(-13,Math.min(13,p.z)));pending=null}}renderer.domElement.addEventListener('pointerdown',tap);
