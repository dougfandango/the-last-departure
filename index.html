<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101720"><title>The Last Stop — Midnight Terminal 3D</title><style>*{box-sizing:border-box}body{margin:0;background:#090e17;color:#f8e7c1;font-family:Georgia,serif;overflow:hidden}canvas{display:block;touch-action:none}#hud{position:fixed;top:0;left:0;right:0;padding:15px 18px;background:linear-gradient(#080d16dc,transparent);pointer-events:none}#title{font-size:19px;letter-spacing:3px;color:#f4d494}#subtitle{font:11px system-ui;letter-spacing:2px;color:#d6b989;margin-top:4px}#top{position:fixed;top:12px;right:12px;display:flex;gap:8px}button{border:1px solid #caa765;background:#172330e8;color:#f5dfaf;padding:10px 13px;border-radius:8px;font:13px system-ui;cursor:pointer}#dialog{position:fixed;bottom:16px;left:12px;right:12px;max-width:650px;margin:auto;background:#101b28ed;border:1px solid #a78752;border-radius:13px;padding:16px;display:none;box-shadow:0 15px 50px #000b}#speaker{color:#edc477;letter-spacing:2px;font:12px system-ui;margin-bottom:8px}#words{font-size:17px;line-height:1.45}#choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}#choices button{background:#2b3541}#hint{position:fixed;bottom:16px;left:10px;right:10px;text-align:center;font:12px system-ui;color:#e8d7b4;text-shadow:0 2px 5px black;pointer-events:none}#toast{position:fixed;top:82px;left:50%;transform:translateX(-50%);background:#1b2a37ed;border:1px solid #b69560;border-radius:9px;padding:10px 15px;font:13px system-ui;display:none;max-width:85vw;text-align:center}#loading{position:fixed;inset:0;background:#0b111a;display:grid;place-items:center;font:18px Georgia;z-index:20;text-align:center;padding:25px}#inv{position:fixed;top:65px;right:12px;background:#111e2bed;border:1px solid #a88a5a;border-radius:9px;padding:12px;display:none;max-width:220px;font:13px system-ui}#inv div{margin-top:9px}#ending{color:#ffe19b}</style></head><body><div id="loading">Opening the gates of the Midnight Terminal…</div><div id="hud"><div id="title">THE LAST STOP</div><div id="subtitle">CHAPTER I · THE MIDNIGHT TERMINAL</div></div><div id="top"><button id="camera">Camera</button><button id="inventory">Inventory</button></div><div id="inv"><b>VINCENT'S POCKETS</b><div id="items">Empty</div></div><div id="toast"></div><div id="hint">Tap the floor to walk · Tap characters and objects to investigate</div><div id="dialog"><div id="speaker"></div><div id="words"></div><div id="choices"></div></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0a1422);scene.fog=new THREE.FogExp2(0x0b1724,.018);

scene.add(new THREE.HemisphereLight(0x8fb4cf,0x443321,1.8));const moon=new THREE.DirectionalLight(0x8eb8f9,2);moon.position.set(-9,20,-14);moon.castShadow=true;moon.shadow.mapSize.set(1024,1024);moon.shadow.camera.left=-32;moon.shadow.camera.right=32;moon.shadow.camera.top=32;moon.shadow.camera.bottom=-32;scene.add(moon);
const mat=(c,metal=0,rough=.75)=>new THREE.MeshStandardMaterial({color:c,metalness:metal,roughness:rough});const stone=mat(0x263848),gold=mat(0xb68a49,.55),ivory=mat(0xe4d5b2),black=mat(0x131923),red=mat(0x7c2934),green=mat(0x27817a),wood=mat(0x4b302c);const interact=[];
function mesh(geo,m,x,y,z,shadow=true){let o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=shadow;o.receiveShadow=true;scene.add(o);return o}function box(w,h,d,m,x,y,z){return mesh(new THREE.BoxGeometry(w,h,d),m,x,y,z)}function cyl(rt,rb,h,m,x,y,z,n=12){return mesh(new THREE.CylinderGeometry(rt,rb,h,n),m,x,y,z)}function sphere(r,m,x,y,z){return mesh(new THREE.SphereGeometry(r,16,12),m,x,y,z)}function label(t,x,y,z,size=1,color='#eacb86'){let c=document.createElement('canvas');c.width=1024;c.height=180;let q=c.getContext('2d');q.fillStyle=color;q.font='bold 70px Georgia';q.textAlign='center';q.fillText(t,512,104);let tx=new THREE.CanvasTexture(c);let s=new THREE.Sprite(new THREE.SpriteMaterial({map:tx,transparent:true,depthWrite:false}));s.position.set(x,y,z);s.scale.set(size*7,size*1.25,1);scene.add(s);return s}

box(46,.6,36,stone,0,-.38,0);for(let x=-22;x<=22;x+=2){for(let z=-17;z<=17;z+=2){box(1.92,.012,1.92,((x+z)/2)%2===0?mat(0x344454):mat(0x283745),x,-.065,z)}}
for(let x of [-18,-12,12,18]){for(let z of [-12,7]){cyl(.75,.9,9,stone,x,4.5,z);cyl(1.1,1.1,.5,gold,x,9,z);cyl(1,1,.5,gold,x,.35,z);let l=new THREE.PointLight(0xffad59,13,12);l.position.set(x,7.8,z);scene.add(l);sphere(.23,mat(0xffc976),x,7.6,z)}}
box(46,12,1.3,stone,0,5.5,-17);box(1.2,12,35,stone,-23,5.5,0);box(1.2,12,35,stone,23,5.5,0);box(46,1,35,stone,0,12,0);for(let z=-14;z<12;z+=7){box(.18,8,4,gold,-22.2,6,z);box(.18,8,4,gold,22.2,6,z)}
// Grand gate
box(15,9,1,black,0,4.5,-16.15);for(let x of [-8,8])box(.65,10,.7,gold,x,5,-15.5);box(17,.7,.9,gold,0,9.5,-15.4);label('PLATFORM  12:07',0,8.8,-14.75,1.6);for(let x=-6;x<=6;x+=3){box(.12,7,.4,gold,x,3.5,-15.6)}
// Huge art deco clock
cyl(2.6,2.6,.45,gold,0,10.7,-16,32).rotation.x=Math.PI/2;cyl(2.22,2.22,.5,ivory,0,10.7,-15.7,32).rotation.x=Math.PI/2;let hand=box(.13,1.6,.1,black,0,11.35,-15.39);hand.rotation.z=.45;let hand2=box(.12,1.15,.1,black,.35,10.8,-15.36);hand2.rotation.z=-1.1;
// ticket booth and luggage
box(7,4,3,wood,-14,2,-5);box(7.4,.25,3.5,gold,-14,4.2,-5);label('TICKETS',-14,5.1,-3.2,.95);box(2.2,1.1,1.4,wood,7,.6,2);box(1.8,.8,1.2,red,9,.4,2.8);box(2,1.4,1.3,wood,8,1.2,2.2);for(let x of [-10,10]){cyl(.08,.08,5,gold,x,2.5,8);sphere(.48,mat(0xffd182),x,5.1,8);let lamp=new THREE.PointLight(0xffb769,8,12);lamp.position.set(x,5.1,8);scene.add(lamp)}
// Railcar glimpsed through gate
box(12,4.3,3.4,green,0,2,-23);box(12,.35,3.5,gold,0,4.2,-23);for(let x=-4;x<=4;x+=4){box(2.5,1.4,.1,mat(0x8ab4bd),x,2.7,-21.22)}
// Character model made from actual 3D geometry
function skeleton(x,z,coat,hat=false,scale=1){const g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(scale);scene.add(g);const add=(geo,m,x,y,z)=>{let a=new THREE.Mesh(geo,m);a.position.set(x,y,z);a.castShadow=true;g.add(a);return a};add(new THREE.CylinderGeometry(.43,.34,1.65,8),mat(coat),0,1.95,0);add(new THREE.CylinderGeometry(.12,.16,.8,8),ivory,-.53,1.87,0).rotation.z=-.15;add(new THREE.CylinderGeometry(.12,.16,.8,8),ivory,.53,1.87,0).rotation.z=.15;for(let dx of [-.22,.22]){add(new THREE.CylinderGeometry(.16,.12,.92,8),black,dx,.73,0);add(new THREE.BoxGeometry(.36,.2,.62),black,dx,.18,.15)}add(new THREE.SphereGeometry(.56,18,14),ivory,0,3.13,0);add(new THREE.BoxGeometry(.49,.32,.32),ivory,0,2.75,.24);for(let dx of [-.22,.22])add(new THREE.SphereGeometry(.145,12,10),black,dx,3.2,.48);add(new THREE.ConeGeometry(.13,.18,3),black,0,2.98,.56).rotation.x=Math.PI;for(let i=-2;i<=2;i++)add(new THREE.BoxGeometry(.055,.17,.035),black,i*.105,2.73,.415);if(hat){add(new THREE.CylinderGeometry(.65,.65,.1,16),black,0,3.64,0);add(new THREE.CylinderGeometry(.43,.46,.6,16),black,0,3.96,0);add(new THREE.CylinderGeometry(.45,.45,.09,16),gold,0,3.76,0)}return g}
const vincent=skeleton(0,8,0x394e60,true,.95);const attendant=skeleton(-12,-1,0x683b4a,true,.85);const singer=skeleton(12,-3,0x7d3343,false,.9);const ghost=skeleton(8,5,0x356e6e,false,.72);
function target(o,name,fn){o.userData.action=fn;o.userData.targetName=name;interact.push(o)}target(attendant,'attendant',()=>talk('MISTER BELL · STATION ATTENDANT','The 12:07? Hasn’t arrived in seventy years. Management insists it is running on time.',[['Why is the clock stopped?',()=>talk('MISTER BELL','Someone removed the clock’s winding key. Without it, the departure gate cannot open.')],['Goodbye.',close]]));target(singer,'singer',()=>talk('MISS MARIGOLD · JAZZ SINGER','Sweetheart, every traveler here has a ticket. Except you. That makes you interesting.',[['Have you seen a key?',()=>talk('MISS MARIGOLD','The porter dropped something shiny by the suitcases. I would look there.')],['What is this place?',()=>talk('MISS MARIGOLD','The place where unfinished stories wait for their ending.')],['Leave.',close]]));target(ghost,'ghost',()=>talk('THE PORTER','I was carrying a winding key. Then I got distracted by the existential dread.',[['Where did it go?',()=>talk('THE PORTER','By the luggage, I think. My memory is a little transparent.')],['Thanks.',close]]));
let keyFound=false,gateOpen=false;const keyMesh=mesh(new THREE.TorusGeometry(.21,.065,8,12),gold,9.5,.4,3.8);keyMesh.rotation.x=Math.PI/2;target(keyMesh,'key',()=>{keyFound=true;keyMesh.visible=false;toast('Collected: brass winding key');refreshInventory()});const clockHit=box(5,5,.15,new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false}),0,10.4,-14.9);target(clockHit,'clock',()=>{if(!keyFound)talk('THE STATION CLOCK','The hands are frozen at 12:07. There is a keyhole in the clockwork.',[['Step away',close]]);else if(!gateOpen){gateOpen=true;hand.rotation.z=0;hand2.rotation.z=-.7;talk('THE STATION CLOCK','The brass key turns. Somewhere beyond the gate, a locomotive whistles. The 12:07 is finally coming.',[['Continue',()=>{talk('CHAPTER I COMPLETE','You have restarted the station clock. Beyond the gate waits the next mystery. To be continued…',[['Explore the terminal',close]])}]]);}else toast('The station clock is running again.')});const gateHit=box(12,7,.1,new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false}),0,3.5,-14.5);target(gateHit,'gate',()=>gateOpen?toast('The 12:07 is ready. The next chapter awaits.'):toast('The departure gate is locked. The clock must be restarted first.'));
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(),ground=new THREE.Plane(new THREE.Vector3(0,1,0),0);let destination=vincent.position.clone(),pending=null,walkTime=0;function interactAt(obj){const fn=obj.userData.action;if(fn)fn()}function tap(e){if(document.getElementById('dialog').style.display==='block')return;mouse.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(mouse,camera);let hits=ray.intersectObjects(interact,true);if(hits.length){let ob=hits[0].object;while(ob&&!ob.userData.action)ob=ob.parent;if(ob){const p=new THREE.Vector3();ob.getWorldPosition(p);destination.set(Math.max(-19,Math.min(19,p.x+ (p.x>0?-2:2))),0,Math.max(-11,Math.min(13,p.z+2)));pending=()=>interactAt(ob);return}}let p=new THREE.Vector3();if(ray.ray.intersectPlane(ground,p)){destination.set(Math.max(-20,Math.min(20,p.x)),0,Math.max(-13,Math.min(13,p.z)));pending=null}}renderer.domElement.addEventListener('pointerdown',tap);
function talk(who,words,choices=[['Continue',close]]){let d=document.getElementById('dialog');d.style.display='block';document.getElementById('hint').style.display='none';document.getElementById('speaker').textContent=who;document.getElementById('words').textContent=words;let el=document.getElementById('choices');el.replaceChildren();choices.forEach(([txt,fn])=>{let b=document.createElement('button');b.textContent=txt;b.onclick=fn;el.append(b)})}function close(){document.getElementById('dialog').style.display='none';document.getElementById('hint').style.display='block'}let toastTimer;function toast(t){let d=document.getElementById('toast');d.textContent=t;d.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>d.style.display='none',3100)}function refreshInventory(){document.getElementById('items').textContent=keyFound?'🗝 Brass winding key':'Empty'}document.getElementById('inventory').onclick=()=>{let d=document.getElementById('inv');d.style.display=d.style.display==='block'?'none':'block'};document.getElementById('camera').onclick=()=>{angle=(angle+1)%angles.length;toast(['Grand hall view','Front view','Side view'][angle])};
let last=performance.now();function animate(t){requestAnimationFrame(animate);let dt=Math.min(.05,(t-last)/1000);last=t;const dx=destination.x-vincent.position.x,dz=destination.z-vincent.position.z,dist=Math.hypot(dx,dz);if(dist>.12){const step=Math.min(dist,dt*4.5);vincent.position.x+=dx/dist*step;vincent.position.z+=dz/dist*step;vincent.rotation.y=Math.atan2(dx,dz);walkTime+=dt*10;vincent.position.y=Math.abs(Math.sin(walkTime))*.055}else{vincent.position.y=0;if(pending){let f=pending;pending=null;f()}}const a=angles[angle],desired=new THREE.Vector3(...a);camera.position.lerp(desired,Math.min(1,dt*2.2));camera.lookAt(0,3,-2);renderer.render(scene,camera)}window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});camera.position.set(...angles[0]);document.getElementById('loading').remove();requestAnimationFrame(animate);setTimeout(()=>talk('VINCENT VALE','A station without a schedule. A train seventy years late. And a clock that refuses to move. Just another ordinary Tuesday.',[['Find the 12:07 train',close]]),600);
</script></body></html>
