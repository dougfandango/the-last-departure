<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>The Last Departure</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b13;color:#f3e6c7;font-family:Georgia,serif}canvas{display:block;touch-action:none}#hud{position:absolute;top:12px;left:12px;right:12px;pointer-events:none;text-shadow:0 2px 5px #000}h1{font-size:21px;letter-spacing:3px;margin:0}#sub{font-size:12px;color:#e6bc75}#dialog{position:absolute;bottom:100px;left:5%;width:90%;box-sizing:border-box;background:#111925e8;border:1px solid #c6a46b;padding:16px;display:none;line-height:1.5;font-size:16px}#dialog button{background:#d3ad73;border:0;padding:9px 17px;margin-top:12px;font-weight:bold}#hint{position:absolute;bottom:18px;left:12px;font:13px sans-serif;color:#ddc69c;pointer-events:none}#action{position:absolute;bottom:18px;right:16px;padding:14px;border-radius:50%;background:#bd9569;color:#15131a;border:0;font-weight:bold;display:none}#error{position:absolute;top:70px;color:#ff9c9c;font:14px sans-serif}</style></head><body><div id="hud"><h1>THE LAST DEPARTURE</h1><div id="sub">CHAPTER ONE · THE TERMINAL BETWEEN WORLDS</div></div><div id="error"></div><div id="dialog"><div id="speech"></div><button id="next">Continue →</button></div><div id="hint">Drag to move · Approach the glowing desk</div><button id="action">TALK</button><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x090d18);scene.fog=new THREE.FogExp2(0x090d18,.032);const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,200);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x7785aa,0x18151a,1.5));const lamp=new THREE.PointLight(0xffb867,110,19);lamp.position.set(0,7,-7);scene.add(lamp);const blue=new THREE.PointLight(0x397bbd,50,22);blue.position.set(-10,5,1);scene.add(blue);
function box(w,h,d,color,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,roughness:.8}));m.position.set(x,y,z);scene.add(m);return m}function cyl(r1,r2,h,color,x,y,z){const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,10),new THREE.MeshStandardMaterial({color}));m.position.set(x,y,z);scene.add(m);return m}
box(35,.3,35,0x242632,0,-.2,0);for(let x=-16;x<=16;x+=4)for(let z=-16;z<=16;z+=4)box(.045,.012,4,0x45404b,x,.005,z);for(let z=-16;z<=16;z+=4)box(35,.012,.045,0x45404b,0,.005,z);
box(35,13,.6,0x171c29,0,6,-16);for(let x of [-13,-7,7,13]){box(1.1,10,1.2,0x35323d,x,5,-14);box(1.6,.4,1.6,0x8a6c4e,x,10,-14)}box(12,4,.3,0x342e35,0,5,-15.5);box(11.3,3.3,.12,0x152d3b,0,5,-15.27);
for(let x of [-11,-5,5,11]){cyl(.1,.1,4,0x6a573d,x,8,-10);const l=new THREE.PointLight(0xe4a75d,35,10);l.position.set(x,6,-10);scene.add(l);cyl(.7,.3,.5,0xe6b875,x,6,-10)}
box(8,1.4,2.2,0x503c35,0,.7,-8);box(8,.2,2.6,0x96734f,0,1.5,-8);box(2.5,.1,.9,0xb6a278,1,1.67,-8);box(.4,.6,.4,0xcda16b,-2,1.9,-8);
const person=new THREE.Group();scene.add(person);const coat=new THREE.Mesh(new THREE.ConeGeometry(.68,2.3,8),new THREE.MeshStandardMaterial({color:0x2d3443}));coat.position.y=1.3;person.add(coat);const head=new THREE.Mesh(new THREE.SphereGeometry(.43,12,10),new THREE.MeshStandardMaterial({color:0xe3d6bb}));head.position.y=2.65;person.add(head);const hat=new THREE.Mesh(new THREE.CylinderGeometry(.52,.52,.15,12),new THREE.MeshStandardMaterial({color:0x24232a}));hat.position.y=3.08;person.add(hat);person.position.set(0,0,7);
const clerk=cyl(.43,.6,2.1,0x2e3541,0,2.6,-9.3);cyl(.4,.4,.8,0xd7c9b4,0,3.95,-9.3);cyl(.7,.7,.12,0x26252d,0,4.43,-9.3);
let target=null,drag=false,start=null;const dialog=document.getElementById('dialog'),speech=document.getElementById('speech'),next=document.getElementById('next'),action=document.getElementById('action');const lines=['CLERK: Welcome to the Terminal Between Worlds. Ticket, please.','YOU: I don’t remember buying a ticket.','CLERK: Nobody does. That’s why we charge a memory instead.','YOU: What happens if I refuse?','CLERK: Then you may wish to investigate the departure board. It has been lying all evening.'];let step=0;
function talk(){step=0;dialog.style.display='block';speech.textContent=lines[step]}action.onclick=talk;next.onclick=()=>{step++;if(step>=lines.length){dialog.style.display='none';document.getElementById('hint').textContent='Mystery unlocked: Why is the departure board lying?';}else speech.textContent=lines[step]};
renderer.domElement.addEventListener('pointerdown',e=>{if(dialog.style.display==='block')return;drag=true;start={x:e.clientX,y:e.clientY};renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!drag||!start)return;const dx=(e.clientX-start.x)/30,dy=(e.clientY-start.y)/30;target={x:Math.max(-14,Math.min(14,person.position.x+dx)),z:Math.max(-13,Math.min(13,person.position.z+dy))};start={x:e.clientX,y:e.clientY}});renderer.domElement.addEventListener('pointerup',()=>drag=false);
window.addEventListener('keydown',e=>{const d={ArrowLeft:[-.6,0],ArrowRight:[.6,0],ArrowUp:[0,-.6],ArrowDown:[0,.6],w:[0,-.6],s:[0,.6],a:[-.6,0],d:[.6,0]}[e.key];if(d)target={x:person.position.x+d[0],z:person.position.z+d[1]};if(e.key===' '&&action.style.display==='block')talk()});
function animate(){requestAnimationFrame(animate);if(target&&dialog.style.display!=='block'){const dx=target.x-person.position.x,dz=target.z-person.position.z;const dist=Math.hypot(dx,dz);if(dist>.05){person.position.x+=dx/dist*Math.min(.12,dist);person.position.z+=dz/dist*Math.min(.12,dist);person.rotation.y=Math.atan2(dx,dz)}else target=null}const near=Math.hypot(person.position.x,person.position.z+6)<4;action.style.display=near&&dialog.style.display!=='block'?'block':'none';camera.position.lerp(new THREE.Vector3(person.position.x,8,person.position.z+12),.045);camera.lookAt(person.position.x,1.5,person.position.z-5);renderer.render(scene,camera)}animate();window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
